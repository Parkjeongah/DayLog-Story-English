<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner glowing decorative shape -->
  <circle cx="256" cy="256" r="180" fill="white" fill-opacity="0.04" />
  <circle cx="380" cy="130" r="70" fill="url(#glowGrad)" fill-opacity="0.15" />

  <!-- Main Emblem: Book + Sparkle + Dialogue Bubble -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Book Base / Pages -->
    <path d="M40 80 C40 80, 100 60, 160 80 C220 60, 280 80, 280 80 L280 240 C280 240, 220 220, 160 240 C100 220, 40 240, 40 240 Z" 
          fill="#ffffff" />
    
    <!-- Spine line -->
    <path d="M160 80 L160 240" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" />

    <!-- Left Page Lines -->
    <path d="M70 120 C100 110, 130 115, 140 120" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <path d="M70 150 C100 140, 130 145, 140 150" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <path d="M70 180 C100 170, 130 175, 140 180" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />

    <!-- Right Page Accent (Speech bubble emblem) -->
    <path d="M180 120 C180 105, 250 105, 250 120 C250 135, 220 145, 205 145 L195 155 L198 145 C185 145, 180 135, 180 120 Z" 
          fill="#4f46e5" />
    <path d="M180 175 C205 170, 235 172, 250 175" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <!-- Top floating Sparkle -->
    <path d="M250 30 Q250 55, 275 55 Q250 55, 250 80 Q250 55, 225 55 Q250 55, 250 30 Z" 
          fill="#38bdf8" />
    <circle cx="295" cy="40" r="5" fill="#facc15" />
  </g>
</svg>
